<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Monaco 5.5 - 前后端打通</title>
</head>
<body>
  <div id="editor" style="width:100%;height:400px;border:1px solid #ccc"></div>
  <button id="btn">取内容(alert)</button>
  <button id="runBtn">运行(发给后端)</button>
  <button id="btnMark">解析报错→标红</button>
  <button id="btnFirst">跳到第一个错误</button>
  <button id="btnClear">清除错误</button>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script>
    require.config({
      paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs" }
    });

    require(["vs/editor/editor.main"], function () {
      const editor = monaco.editor.create(document.getElementById("editor"), {
        value: '#include <iostream>\nint main() {\n  std::cout << "Hello"\n  return 0;\n}\n',
        language: "cpp",
        theme: "vs-dark",
        fontSize: 14,
        automaticLayout: true,
      });

      function parseErrors(stderr) {
        const re = /^(.+?):(\d+):(\d+):\s*(error|warning|note):\s*(.+)$/;
        const marks = [];
        for (const line of stderr.split("\n")) {
          const m = line.match(re);
          if (!m) continue;
          const [, , lineNo, col, severity, message] = m;
          marks.push({
            startLineNumber: +lineNo,
            startColumn: +col,
            endLineNumber: +lineNo,
            endColumn: +col + 1,
            message,
            severity: severity === "error"
              ? monaco.MarkerSeverity.Error
              : monaco.MarkerSeverity.Warning,
          });
        }
        return marks;
      }

      const fakeStderr = `main.cpp:3:21: error: expected ';' before 'return' token`;

      document.getElementById("btn").onclick = () => {
        alert(editor.getValue());
      };

      async function run() {
        const res = await fetch("http://localhost:8000/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            files: [{ name: "main.cpp", content: editor.getValue() }],
            stdin: "",
          }),
        });
        const data = await res.json();
        console.log(data);
      }

      document.getElementById("runBtn").onclick = run;

      document.getElementById("btnMark").onclick = () => {
        const marks = parseErrors(fakeStderr);
        monaco.editor.setModelMarkers(editor.getModel(), "gcc", marks);
      };

      document.getElementById("btnFirst").onclick = () => {
        const marks = parseErrors(fakeStderr);
        if (marks.length) {
          editor.setPosition({ lineNumber: marks[0].startLineNumber, column: marks[0].startColumn });
          editor.revealLineInCenter(marks[0].startLineNumber);
          editor.focus();
        }
      };

      document.getElementById("btnClear").onclick = () => {
        monaco.editor.setModelMarkers(editor.getModel(), "gcc", []);
      };
    });
  </script>
</body>
</html>
